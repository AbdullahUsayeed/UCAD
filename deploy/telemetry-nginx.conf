# AICompanion telemetry receiver — reverse proxy (port 80).
#
# For HTTPS you MUST add a DNS A record (e.g. telemetry.example.com -> 52.77.213.181)
# and then run `certbot --nginx -d telemetry.example.com` (Lightsail firewall must allow 443).

limit_req_zone $binary_remote_addr zone=telemetry:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # 100 events * up to 50KB command text per batch
    client_max_body_size 20M;

    location / {
        limit_req zone=telemetry burst=50 nodelay;
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
