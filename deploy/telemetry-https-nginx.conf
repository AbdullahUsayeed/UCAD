# UCAD AICompanion telemetry receiver — HTTPS reverse proxy.
# Dedicated hostname: ucadtelemetry.duckdns.org -> 52.77.213.181 -> 127.0.0.1:7999

limit_req_zone $binary_remote_addr zone=telemetry_https:10m rate=10r/s;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name ucadtelemetry.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS site
server {
    listen 443 ssl http2;
    server_name ucadtelemetry.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ucadtelemetry.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ucadtelemetry.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 100 events * up to 50KB command text per batch
    client_max_body_size 20M;

    location /health {
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=telemetry_https burst=50 nodelay;
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
